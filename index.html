<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verity</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff6d6;--fg:#2a2200;--mut:#7a6a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1700;--fg:#fff1b0;--mut:#b09a3a}}
:root[data-theme="dark"]{--bg:#1b1700;--fg:#fff1b0;--mut:#b09a3a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Fraunces",Georgia,serif;overflow:hidden;display:flex;flex-direction:column}
h1{margin:0;padding:28px 24px 0;font-size:clamp(2rem,6vw,3.2rem);font-weight:700;letter-spacing:-.02em;text-align:center}
p{margin:6px 0 0;text-align:center;color:var(--mut);font-size:1rem}
#stage{flex:1;min-height:0;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
</style>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
</head><body>
<h1>Verity</h1><p>Потяни, чтобы покрутить</p>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,.1,50);camera.position.z=7;
scene.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,4,6);scene.add(dl);
new THREE.AmbientLight(0xffffff,.6)
new THREE.DirectionalLight(0xffffff,.7)

const img=new Image();
img.onload=()=>{
  const front=new THREE.Texture(img);front.needsUpdate=true;front.anisotropy=8;front.encoding=THREE.sRGBEncoding;

  const R=1.6;
  const geo=new THREE.SphereGeometry(R,128,64).toNonIndexed();
  const pos=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i+=3){
    const back=(pos.getZ(i)+pos.getZ(i+1)+pos.getZ(i+2))<0;
    for(let k=i;k<i+3;k++){
      const u=.5+pos.getX(k)/R*.475,v=.5+pos.getY(k)/R*.475;
      uv.setXY(k,back?.5:u,back?.9:v);
    }
  }
  const ball=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:front,roughness:.35}));
  const g=new THREE.Group();g.add(ball);scene.add(g);

  let vx=.01,vy=0,drag=false,lx=0,ly=0;
  stage.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointerup',()=>drag=false);
  stage.addEventListener('pointermove',e=>{
    if(!drag)return;
    vx=(e.clientX-lx)*.006;vy=(e.clientY-ly)*.006;
    g.rotation.y+=vx;g.rotation.x+=vy;
    lx=e.clientX;ly=e.clientY;
  });

  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){
    const w=stage.clientWidth,h=stage.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.position.z=w/h<.8?9:7;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize',size);size();

  (function loop(){
    requestAnimationFrame(loop);
    if(!drag){
      if(!still)g.rotation.y+=vx;
      vx+=(.008-vx)*.02;
      g.rotation.x+=vy;vy*=.92;
    }
    renderer.render(scene,camera);
  })();
};
img.src="./img/verity.png";
</script></body></html>
